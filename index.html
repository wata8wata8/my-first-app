<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101a2d">
    <title>NEON OVERDRIVE - スーパーカー・ラン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <div>
                <p class="eyebrow">NEON OVERDRIVE</p>
                <h1>SUPER CAR RUN</h1>
            </div>
            <p class="how-to-play">← → / A D で走行 <span>・</span> Space / ↑ でジャンプ <span>・</span> Shift でブースト</p>
        </header>

        <section class="game-frame" aria-label="スーパーカーの横スクロールゲーム">
            <div class="hud" aria-live="polite">
                <span>ターボセル <strong id="coin-count">0</strong></span>
                <span>ゴールまで <strong id="distance">0 m</strong></span>
                <span class="turbo-readout">BOOST <strong id="boost-level">45%</strong></span>
                <button id="music-toggle" type="button" aria-pressed="false">♪ SOUND OFF</button>
            </div>
            <canvas id="game" width="960" height="540" aria-label="スーパーカーを操作してゴールを目指します">
                このゲームを遊ぶには、Canvasに対応したブラウザーが必要です。
            </canvas>
            <div class="message" id="message" hidden>
                <div class="message-card">
                    <p class="eyebrow" id="message-eyebrow">READY TO RACE?</p>
                    <h2 id="message-title">限界まで加速しろ。</h2>
                    <p id="message-copy">ターボセルを集めてブースト！ライバルをかわして、ネオンハイウェイを駆け抜けよう。</p>
                    <button id="start-button" type="button">レーススタート</button>
                </div>
            </div>
        </section>

        <nav class="touch-controls" aria-label="タッチ操作">
            <button type="button" data-control="left" aria-label="左へ移動">←</button>
            <button type="button" data-control="right" aria-label="右へ移動">→</button>
            <button type="button" data-control="jump" aria-label="ジャンプ">ジャンプ</button>
            <button type="button" data-control="boost" aria-label="ブースト">BOOST</button>
        </nav>
        <footer>ライバルに接触すると減速します。ターボセルでエネルギーを補給してゴールを目指そう！</footer>
    </main>
    <script src="game.js"></script>
</body>
</html>
